<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8E1B1B">
<title>Jingle Flip – Santa's Workshop Pinball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&amp;family=Nunito:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
:root { --red:#8E1B1B; --deep:#5A1010; --gold:#E0B04B; --pale:#F6DFA6; --pine:#1F3A2E; --snow:#FFF8EC; --ember:#C9472F; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--pine); overflow: hidden; overscroll-behavior: none; }
body { font-family: Nunito, system-ui, sans-serif; color: var(--snow); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; height: 100dvh; }
#hud { background: var(--red); border-bottom: 4px solid var(--gold); padding: calc(env(safe-area-inset-top) + 10px) 18px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lbl { display: block; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--pale); }
.num { font-family: Fraunces, Georgia, serif; font-weight: 800; line-height: 1; }
#score { font-size: 30px; font-variant-numeric: tabular-nums; }
#hudR { display: flex; align-items: center; gap: 10px; }
#ball { font-size: 22px; text-align: center; }
#mult { padding: 6px 10px; border-radius: 999px; background: var(--gold); color: var(--deep); font-weight: 800; font-size: 14px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--pale); background: transparent; color: var(--snow); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
#missionRow { display: flex; justify-content: center; padding: 8px 12px 0; background: var(--pine); }
#mission { padding: 6px 16px; border-radius: 999px; background: var(--snow); color: var(--red); font-weight: 800; font-size: 13px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--pine); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chip { position: absolute; height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--pale); background: rgba(31,58,46,.82); color: var(--pale); font: 800 12px Nunito, sans-serif; letter-spacing: .08em; cursor: pointer; }
#viewBtn { top: 10px; left: 10px; }
#nudge { bottom: 10px; left: 10px; width: 56px; height: 56px; padding: 0; border-radius: 50%; line-height: 1.1; }
#toast { position: absolute; left: 50%; top: 12%; transform: translate(-50%, 0) scale(.9); opacity: 0; padding: 10px 20px; border-radius: 14px; background: var(--gold); color: var(--deep); font: 800 16px Fraunces, Georgia, serif; text-align: center; max-width: 90%; pointer-events: none; transition: opacity .18s, transform .18s; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#meter { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: 62%; max-width: 280px; height: 30px; border-radius: 999px; background: rgba(31,58,46,.88); border: 2px solid var(--pale); overflow: hidden; display: none; }
#meter.show { display: block; }
#meterFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--ember)); }
#meterTxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 12px Nunito, sans-serif; letter-spacing: .1em; color: var(--snow); }
#pads { display: grid; grid-template-columns: 1fr 1fr; height: calc(84px + env(safe-area-inset-bottom)); border-top: 2px solid var(--gold); background: var(--pine); }
.pad { border: 0; background: transparent; color: var(--pale); font: 800 12px Nunito, sans-serif; letter-spacing: .1em; padding-bottom: env(safe-area-inset-bottom); }
.pad + .pad { border-left: 1px solid rgba(224,176,75,.4); }
.pad.on { background: rgba(224,176,75,.28); color: var(--snow); }
#overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(20,39,30,.58); z-index: 5; }
#overlay.show { display: flex; }
.card { width: 100%; max-width: 360px; padding: 28px 24px; border-radius: 22px; background: var(--snow); color: #2B1A12; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.28); }
.card .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--red); }
.card h1 { margin: 6px 0 8px; font: 800 40px/1.05 Fraunces, Georgia, serif; color: var(--pine); }
.card p { margin: 0 0 18px; font-weight: 600; line-height: 1.45; color: #4A3A30; font-size: 14px; }
.card .big { font: 800 36px Fraunces, Georgia, serif; color: var(--red); margin: 0 0 4px; }
.btn { display: block; width: 100%; height: 52px; margin-top: 10px; border: none; border-radius: 999px; background: var(--red); color: var(--snow); font: 800 16px Nunito, sans-serif; box-shadow: 0 4px 0 var(--deep); cursor: pointer; }
.btn.alt { background: transparent; color: var(--pine); border: 2px solid var(--pine); box-shadow: none; }
.hint { margin-top: 14px; font-size: 12px; font-weight: 600; color: #6a564a; line-height: 1.5; }
button:focus-visible { outline: 3px solid var(--pale); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div>
      <span class="lbl">SCORE</span>
      <span id="score" class="num">0</span>
    </div>
    <div id="hudR">
      <div id="ball" class="num"><span class="lbl">BALL</span><span id="ballN">1/3</span></div>
      <div id="mult">×1</div>
      <button id="pause" class="round" data-ui aria-label="Pause">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div id="missionRow"><div id="mission">MISSION · Wrap the Presents  0/10</div></div>
  <main id="stage">
    <canvas id="gl" aria-label="3D pinball table"></canvas>
    <button id="viewBtn" class="chip" data-ui>VIEW · Auto</button>
    <button id="nudge" class="chip" data-ui aria-label="Nudge the table">NUDGE</button>
    <div id="toast" role="status"></div>
    <div id="meter"><div id="meterFill"></div><div id="meterTxt">HOLD TO PULL · RELEASE TO LAUNCH</div></div>
    <div id="overlay" data-ui>
      <div class="card" id="card"></div>
    </div>
  </main>
  <footer id="pads">
    <button class="pad" id="padL" tabindex="-1">TAP · LEFT</button>
    <button class="pad" id="padR" tabindex="-1">TAP · RIGHT</button>
  </footer>
</div>
<script src="/leaderboard.js"></script>
